name: Aggiorna quotazioni e pubblica

on:
  push:
    branches: [main]
  schedule:
    - cron: "30 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Leggi quotazione da Confinvest
        run: python scripts/aggiorna.py
        continue-on-error: true
      - name: Salva lo storico nel repository
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/storico.json
          git diff --cached --quiet || (git commit -m "Aggiorna quotazioni" && git push)
      - name: Prepara il sito
        run: |
          mkdir _site
          cp -r index.html sw.js manifest.webmanifest icons data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  pubblica:
    needs: aggiorna
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
